import org.springframework.beans.factory.annotation.Value;
import org.springframework.kafka.annotation.KafkaListener;
import org.springframework.stereotype.Service;
import com.yourpackage.Transaction;

@Service
public class TransactionListener {

    @Value("${midas.transactions.topic}")
    private String topic;

    @KafkaListener(topics = "#{__listener.topic}", groupId = "midas-core-group")
    public void listen(Transaction transaction) {
        // For now, just receive the transaction object. Processing comes later.
        System.out.println("Received transaction: " + transaction);
    }
}

import org.springframework.web.bind.annotation.GetMapping;
import org.springframework.web.bind.annotation.RequestParam;
import org.springframework.web.bind.annotation.RestController;
import java.util.Optional;

@RestController
public class BalanceController {

    private final UserRepository userRepository;

    public BalanceController(UserRepository userRepository) {
        this.userRepository = userRepository;
    }

    @GetMapping("/balance")
    public Balance getBalance(@RequestParam String userId) {
        Optional<User> user = userRepository.findById(userId);
        double amount = user.map(User::getBalance).orElse(0.0);
        return new Balance(amount);
    }
}
